<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Multifuncional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora">
        <header class="header">
            <h1>Calculadora</h1>
        </header>
        
        <div class="display-container">
            <input type="text" id="expressao" placeholder="0" autocomplete="off">
            <div class="resultado-box">
                <span class="resultado-label">Resultado</span>
                <h2 id="resultado">0</h2>
            </div>
        </div>

        <div class="botoes">
            <!-- Linha 1: Limpeza e Parênteses -->
            <button class="btn fn-btn" onclick="limpar()">C</button>
            <button class="btn fn-btn" onclick="adicionar('(')">(</button>
            <button class="btn fn-btn" onclick="adicionar(')')">)</button>
            <button class="btn op-btn" onclick="adicionar('/')">÷</button>

            <!-- Linha 2 -->
            <button class="btn" onclick="adicionar('7')">7</button>
            <button class="btn" onclick="adicionar('8')">8</button>
            <button class="btn" onclick="adicionar('9')">9</button>
            <button class="btn op-btn" onclick="adicionar('*')">×</button>

            <!-- Linha 3 -->
            <button class="btn" onclick="adicionar('4')">4</button>
            <button class="btn" onclick="adicionar('5')">5</button>
            <button class="btn" onclick="adicionar('6')">6</button>
            <button class="btn op-btn" onclick="adicionar('-')">−</button>

            <!-- Linha 4 -->
            <button class="btn" onclick="adicionar('1')">1</button>
            <button class="btn" onclick="adicionar('2')">2</button>
            <button class="btn" onclick="adicionar('3')">3</button>
            <button class="btn op-btn" onclick="adicionar('+')">+</button>

            <!-- Linha 5 -->
            <button class="btn fn-btn" onclick="apagar()">⌫</button>
            <button class="btn" onclick="adicionar('0')">0</button>
            <button class="btn" onclick="adicionar('.')">.</button>
            <button class="btn eq-btn" onclick="calcularFinal()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
